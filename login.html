<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>html,body{height:100%}body{margin:0}</style>
<title>Clinnova — Iniciar sesión</title>
<style>
/* Login: tarjeta partida — formulario a la izquierda, foto + características a la derecha */
:root{
  --blue:#1693f7; --blue-ink:#0a7ad6; --blue-soft:#e4f2fd;
  --navy:#15294a; --ink:#334155; --ink-2:#5b6b82; --ink-3:#9aa7b8;
  --page:#e4f1fd; --card:#ffffff; --field:#f3f7fb; --line:#e3ebf3;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--page);-webkit-font-smoothing:antialiased}
svg.ic{width:20px;height:20px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}

.page{min-height:100vh;display:grid;place-items:center;padding:26px;position:relative;overflow:hidden}
.page::before,.page::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,#c3e2fb,transparent 70%);opacity:.6;z-index:0}
.page::before{width:420px;height:420px;top:-140px;left:-120px}
.page::after{width:360px;height:360px;bottom:-120px;right:-100px}

.auth{position:relative;z-index:1;width:100%;max-width:1180px;background:var(--card);border-radius:30px;box-shadow:0 30px 80px rgba(30,80,140,.20);overflow:hidden;display:grid;grid-template-columns:1fr 1.06fr;min-height:640px}

/* ---- Formulario (izquierda) ---- */
.form-side{padding:50px 54px;display:flex;flex-direction:column;justify-content:center}
.form-inner{width:100%;max-width:400px;margin:0 auto}
.flogo{height:52px;width:auto;max-width:260px;object-fit:contain;display:block;margin-bottom:26px}
.form-side h1{font-size:34px;line-height:1.14;font-weight:800;letter-spacing:-.6px;color:var(--navy);margin:0 0 10px;text-wrap:balance}
.form-side h1 b{color:var(--blue)}
.form-side .sub{font-size:15px;color:var(--ink-2);margin:0 0 26px;line-height:1.5}

.lbl{display:block;font-size:13.5px;font-weight:700;color:var(--navy);margin:0 0 8px}
.field{position:relative;margin-bottom:18px}
.field .lic{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-3);width:20px;height:20px;pointer-events:none}
.field input{width:100%;border:1.5px solid var(--line);background:var(--field);border-radius:13px;padding:14px 16px 14px 45px;font-size:15px;color:var(--navy);font-family:inherit;transition:border-color .15s,background .15s,box-shadow .15s}
.field input::placeholder{color:var(--ink-3)}
.field input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(22,147,247,.13)}
.field .eye{position:absolute;right:11px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--ink-3);cursor:pointer;padding:6px;display:grid;place-items:center}
.field .eye:hover{color:var(--blue-ink)}

.row{display:flex;align-items:center;justify-content:space-between;margin:2px 0 20px;flex-wrap:wrap;gap:8px}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14px;color:var(--ink)}
.check input{position:absolute;opacity:0;width:0;height:0}
.check .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--ink-3);display:grid;place-items:center;color:#fff;transition:.15s}
.check input:checked + .box{background:var(--blue);border-color:var(--blue)}
.check .box .ic{width:13px;height:13px;stroke-width:3;opacity:0}
.check input:checked + .box .ic{opacity:1}
.link{color:var(--blue-ink);font-size:13.5px;font-weight:700;text-decoration:none;cursor:pointer}
.link:hover{text-decoration:underline}

.btn{width:100%;border:0;background:var(--blue);color:#fff;font-weight:700;font-size:15.5px;border-radius:13px;padding:15px;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;box-shadow:0 12px 26px rgba(22,147,247,.34);transition:background .15s,transform .05s}
.btn:hover{background:var(--blue-ink)}
.btn:active{transform:translateY(1px)}
.btn .ic{width:19px;height:19px;stroke-width:2.4}

.divider{display:flex;align-items:center;gap:14px;color:var(--ink-3);font-size:13px;margin:20px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.social{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:12px;font-weight:600;font-size:14.5px;color:var(--navy);cursor:pointer;transition:background .15s,border-color .15s}
.sbtn:hover{background:#f7fafd;border-color:#d4deea}
.sbtn svg{width:19px;height:19px}

.foot{text-align:center;font-size:14px;color:var(--ink-2);margin-top:22px}
.msg{display:none;margin:0 0 16px;padding:11px 14px;border-radius:12px;font-size:13.5px;font-weight:600}
.msg.show{display:block}
.msg.err{background:#fdeaea;color:#c0392b}
.msg.ok{background:#e4f6ec;color:#15804e}

/* ---- Media (derecha) ---- */
.media-side{position:relative;background:url('img/login-bg.webp') center/cover no-repeat;min-height:640px}
.media-side::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(80,150,220,.12),rgba(40,100,180,.10) 55%,rgba(30,80,150,.22));z-index:0}

.lang{position:absolute;top:22px;right:22px;z-index:6}
.lbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.7);border-radius:30px;padding:9px 14px;font-size:14px;font-weight:600;color:var(--navy);cursor:pointer;box-shadow:0 5px 16px rgba(20,60,110,.18)}
.lbtn .ic{width:17px;height:17px;color:var(--blue-ink)}
.lbtn .cv{width:15px;height:15px;color:var(--ink-3)}
.lmenu{position:absolute;top:48px;right:0;background:#fff;border-radius:13px;box-shadow:0 12px 34px rgba(20,60,110,.24);overflow:hidden;min-width:158px;display:none}
.lang.open .lmenu{display:block}
.lmenu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 15px;font-size:14px;color:var(--navy);cursor:pointer;text-align:left;font-family:inherit}
.lmenu button:hover{background:#f0f6fd}
.lmenu button.on{color:var(--blue-ink);font-weight:700;background:#f4f9fe}

.glass{position:absolute;left:24px;right:24px;bottom:70px;z-index:2;background:rgba(255,255,255,.24);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.5);border-radius:22px;padding:22px 24px;box-shadow:0 14px 40px rgba(20,60,110,.22)}
.slide{display:grid;grid-template-columns:1fr 1fr;gap:18px 24px}
.gf{display:flex;gap:12px;align-items:flex-start}
.gf .gi{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--blue-ink);flex:none;box-shadow:0 3px 8px rgba(20,60,110,.12)}
.gf .gi .ic{width:21px;height:21px}
.gf b{font-size:14.5px;color:#12274a;display:block;margin-bottom:2px}
.gf span{font-size:12.5px;color:#2c4064;line-height:1.35}

.cwrap{position:absolute;left:0;right:0;bottom:30px;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.65);cursor:pointer;transition:.2s}
.dot.on{background:#fff;width:22px;border-radius:5px}
.next{position:absolute;right:24px;bottom:20px;z-index:3;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;border:0;cursor:pointer;color:var(--blue-ink);box-shadow:0 5px 14px rgba(20,60,110,.22)}
.next .ic{width:20px;height:20px;stroke-width:2.3}

@media (max-width:920px){
  .auth{grid-template-columns:1fr;max-width:470px;min-height:0}
  .media-side{display:none}
  .form-side{padding:40px 30px}
}
@media (max-width:420px){ .form-side{padding:30px 20px} .form-side h1{font-size:29px} }
</style>
</head>

        <h1><span data-i18n="t1">Inicia sesión en </span><b data-i18n="t2">tu cuenta</b></h1>
        <p class="sub" data-i18n="sub">Accede a Clinnova y gestiona tu clínica de forma rápida, segura y eficiente.</p>

        <div class="msg" id="msg"></div>

        <label class="lbl" for="email" data-i18n="lblEmail">Correo electrónico</label>
        <div class="field">
          <svg class="ic lic"><use href="#i-mail"/></svg>
          <input id="email" type="email" autocomplete="username" data-ph="phEmail" placeholder="tu@email.com" required>
        </div>

        <label class="lbl" for="password" data-i18n="lblPwd">Contraseña</label>
        <div class="field">
          <svg class="ic lic"><use href="#i-lock"/></svg>
          <input id="password" type="password" autocomplete="current-password" data-ph="phPwd" placeholder="Ingresa tu contraseña" required>
          <button type="button" class="eye" id="togglePwd" aria-label="Mostrar/ocultar"><svg class="ic"><use href="#i-eyeoff" id="eyeUse"/></svg></button>
        </div>

        <div class="row">
          <label class="check"><input type="checkbox" id="remember" checked><span class="box"><svg class="ic"><use href="#i-check"/></svg></span><span data-i18n="remember">Recordarme</span></label>
          <a class="link" data-i18n="forgot">¿Olvidaste tu contraseña?</a>
        </div>

        <button class="btn" type="submit" id="submitBtn"><span data-i18n="signin">Iniciar sesión</span> <svg class="ic"><use href="#i-arrow"/></svg></button>

        <div class="divider" data-i18n="orwith">o continúa con</div>

function renderSlide(){
  const box=document.getElementById('slide');
  box.innerHTML=SLIDES[lang][slide].map(f=>

}

  const d=T[lang];
  document.querySelectorAll('[data-i18n]').forEach(el=>{ if(d[el.dataset.i18n]!=null) el.textContent=d[el.dataset.i18n]; });
  document.querySelectorAll('[data-ph]').forEach(el=>{ if(d[el.dataset.ph]!=null) el.placeholder=d[el.dataset.ph]; });
  document.getElementById('langLabel').textContent=d.langLabel;
  document.title=d.docTitle;
  document.documentElement.lang=lang;
  document.querySelectorAll('.lmenu button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  renderSlide();
  try{ localStorage.setItem('clinnova_lang',lang); }catch(_){}
}

// dots
const dotsWrap=document.getElementById('dots');
SLIDES.es.forEach((_,i)=>{ const b=document.createElement('button'); b.className='dot'+(i===0?' on':''); b.addEventListener('click',()=>{slide=i;renderSlide();}); dotsWrap.appendChild(b); });
document.getElementById('nextBtn').addEventListener('click',()=>{ slide=(slide+1)%SLIDES.es.length; renderSlide(); });
let auto=setInterval(()=>{ slide=(slide+1)%SLIDES.es.length; renderSlide(); },6000);

// selector de idioma
const langBox=document.getElementById('lang');
document.getElementById('langBtn').addEventListener('click',(e)=>{ e.stopPropagation(); langBox.classList.toggle('open'); });
document.querySelectorAll('.lmenu button').forEach(b=>b.addEventListener('click',()=>{ lang=b.dataset.lang; langBox.classList.remove('open'); applyLang(); }));
document.addEventListener('click',()=>langBox.classList.remove('open'));

// mostrar/ocultar contraseña
const pwd=document.getElementById('password'), eyeUse=document.getElementById('eyeUse');
document.getElementById('togglePwd').addEventListener('click',()=>{ const s=pwd.type==='password'; pwd.type=s?'text':'password'; eyeUse.setAttribute('href',s?'#i-eye':'#i-eyeoff'); });

// mensajes
const msg=document.getElementById('msg');
function showMsg(text,type){ msg.textContent=text; msg.className='msg show '+type; }

// login contra el backend
const API='http://localhost:4000/api';
document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const d=T[lang];
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  if(!email||!password){ showMsg(d.mFill,'err'); return; }
  const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.style.opacity='.7';
  showMsg(d.mChecking,'ok');
  try{
    const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await r.json();
    if(!r.ok){ showMsg(data.error||d.mBad,'err'); return; }
    try{ const store=document.getElementById('remember').checked?localStorage:sessionStorage;
      store.setItem('clinnova_token',data.token); store.setItem('clinnova_user',JSON.stringify(data.usuario)); }catch(_){}
    showMsg(d.mWelcome.replace('%s',(data.usuario&&data.usuario.nombre)||''),'ok');
    setTimeout(()=>{ window.location.href='Clinnova.html'; },700);
  }catch(err){ showMsg(d.mConn,'err'); }
  finally{ btn.disabled=false; btn.style.opacity='1'; }
});
document.getElementById('googleBtn').addEventListener('click',()=>showMsg(T[lang].mSoon.replace('%s','Google'),'ok'));
document.getElementById('appleBtn').addEventListener('click',()=>showMsg(T[lang].mSoon.replace('%s','Apple'),'ok'));

applyLang();
</script>

</body>
</html>
