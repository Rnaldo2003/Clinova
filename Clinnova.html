<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Clinnova · Panel</title>
<link rel="icon" href="img/logo-clinnova.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fixed sidebar + topbar, scrollable dashboard grid of cards */
:root{
  --bg:#eaf2fb; --surface:#ffffff; --surface-2:#f4f9fd;
  --ink:#17212c; --ink-2:#5a6b7d; --ink-3:#8a98a8;
  --line:#e4ecf4; --line-2:#eef3f9;
  --brand:#4fc3ff; --brand-ink:#0f72b8; --brand-soft:#e3f4ff;
  --nav-top:#6cbcf5; --nav-bot:#3471b4;
  --nav-ink:#eef6ff;
  --good:#16a864; --good-soft:#d4f3e1;
  --warn:#c9871f; --warn-soft:#fbe8cc;
  --crit:#e3574e; --crit-soft:#fce5e6;
  --info:#1796f4; --info-soft:#e6f3fd;
  --purple:#8b5cf6; --purple-soft:#eee9fd;
  --neutral:#93a1b2; --neutral-soft:#dce5ef;
  --shadow:0 1px 2px rgba(22,34,51,.04),0 6px 20px rgba(22,34,51,.05);
  --shadow-sm:0 1px 2px rgba(22,34,51,.05);
  --r:16px; --r-sm:12px; --r-xs:9px;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100%}
svg.ic{width:20px;height:20px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--ink-2)}
button{font-family:inherit;cursor:pointer}

/* ===== Sidebar ===== */
.side{background:linear-gradient(176deg,var(--nav-top),var(--nav-bot));color:var(--nav-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:18px 14px}
.brand{display:block;padding:4px 4px 16px}
.brandlogo{display:block;width:100%;padding:6px 6px 2px;box-sizing:border-box}
.brand .logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.2);display:grid;place-items:center;color:#fff}
.brand b{font-size:19px;font-weight:800;letter-spacing:.2px;display:block;color:var(--nav-ink)}
.brand span{font-size:11.5px;color:#d3e9fb}
.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;scrollbar-width:thin}
.nav::-webkit-scrollbar{width:0}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 11px;border-radius:11px;color:var(--nav-ink);text-decoration:none;font-weight:600;font-size:13.5px;position:relative}
.nav a .ic{width:19px;height:19px;opacity:.95}
.nav a:hover{background:rgba(255,255,255,.16);color:#fff}
.nav a.on{background:#fff;color:var(--brand-ink);box-shadow:0 4px 12px rgba(10,60,100,.18)}
.nav a .pill{margin-left:auto;background:var(--crit);color:#fff;font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.nav a.on .pill{background:var(--crit)}
.nav .sec{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#c3def8;padding:16px 12px 7px;font-weight:700}
.side .foot{margin-top:auto;padding-top:12px}
.clinic{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.15);border-radius:13px;padding:10px 12px}
.clinic .logo{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.22);display:grid;place-items:center;color:#fff}
.clinic b{color:#fff;font-size:13px;display:block}
.clinic span{color:#d3e9fb;font-size:11px}
.clinic .ic{margin-left:auto;width:16px;height:16px;color:#d3e9fb}

/* ===== Topbar ===== */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:12px 26px}
.search{flex:1;max-width:560px;position:relative;display:flex;align-items:center}
.search .ic{position:absolute;left:13px;color:var(--ink-3);width:18px;height:18px}
.search input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 54px 10px 40px;font-size:13.5px;color:var(--ink);font-family:inherit}
.search input::placeholder{color:var(--ink-3)}
.search kbd{position:absolute;right:10px;font-size:11px;color:var(--ink-3);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-family:inherit}
.top .sp{flex:1}
.iconbtn{position:relative;width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;background:var(--crit);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;border:2px solid var(--surface)}
.me{display:flex;align-items:center;gap:10px;padding:5px 7px 5px 5px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.me:hover{background:var(--surface-2)}
.mewrap{position:relative}
.memenu{position:absolute;top:50px;right:0;z-index:40;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;min-width:170px;display:none}
.mewrap.open .memenu{display:block}
.memenu button{display:block;width:100%;border:0;background:none;padding:11px 14px;font-size:13.5px;color:var(--red,#c0392b);cursor:pointer;text-align:left;font-family:inherit}
.memenu button:hover{background:var(--surface-2)}
.me .av{width:34px;height:34px;border-radius:9px;object-fit:cover}
.me b{font-size:13px;display:block;line-height:1.2}
.me span{font-size:11.5px;color:var(--ink-2)}
.av{background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:13px}

/* ===== Dashboard ===== */
.wrap{padding:22px 26px 34px;max-width:1500px;width:100%}
.head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.head h1{margin:0;font-size:25px;font-weight:800;letter-spacing:-.3px}
.head p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.head .when{margin-left:auto;text-align:right;color:var(--ink-2);font-size:13.5px;align-self:center}
.weather{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;box-shadow:var(--shadow-sm)}
.weather .t{font-weight:800;color:var(--ink)}
.weather .ic{color:var(--warn)}

/* stat row */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.stat:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(22,34,51,.1)}
.stat .ico{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.stat .ico .ic{width:23px;height:23px}
.stat .n{font-size:27px;font-weight:800;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .l{color:var(--ink-2);font-size:12.5px;margin-top:3px}
.stat .arr{margin-left:auto;color:var(--ink-3)}
.stat .arr .ic{width:17px;height:17px}
.trend{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;font-weight:700;margin-left:7px}
.trend.up{color:var(--good)} .trend.hot{color:var(--crit)}
.trend .ic{width:12px;height:12px;stroke-width:2.6}
.i-blue{background:var(--info-soft);color:var(--info)}
.i-amber{background:var(--warn-soft);color:var(--warn)}
.i-green{background:var(--good-soft);color:var(--good)}
.i-red{background:var(--crit-soft);color:var(--crit)}
.i-purple{background:var(--purple-soft);color:var(--purple)}

/* main grid */
.grid{display:grid;grid-template-columns:1.35fr 1.15fr 1fr;gap:16px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card .ch{display:flex;align-items:center;gap:9px;padding:15px 17px 12px}
.card .ch h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
.card .ch h3 .ic{width:18px;height:18px;color:var(--brand)}
.card .ch .link{margin-left:auto;color:var(--brand);font-size:12.5px;font-weight:600;background:none;border:0;display:inline-flex;align-items:center;gap:4px}
.card .ch .link .ic{width:14px;height:14px}
.card .cb{padding:4px 17px 17px}
.col{display:flex;flex-direction:column;gap:16px}

/* agenda */
.appt{display:flex;align-items:center;gap:13px;padding:10px 8px;border-radius:12px}
.appt:hover{background:var(--surface-2)}
.appt+.appt{border-top:1px solid var(--line-2)}
.appt .time{font-weight:700;font-size:13px;color:var(--ink-2);width:42px;flex:none;font-variant-numeric:tabular-nums}
.appt .av{width:40px;height:40px;border-radius:11px;flex:none;font-size:13px}
.appt .who{min-width:0;flex:1}
.appt .who b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appt .who span{font-size:12px;color:var(--ink-2)}
.appt .dots{color:var(--ink-3);background:none;border:0;padding:4px}
.badge{font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;white-space:nowrap}
.b-green{background:var(--good-soft);color:var(--good)}
.b-amber{background:var(--warn-soft);color:var(--warn)}
.b-grey{background:var(--neutral-soft);color:var(--ink-2)}
.btn-primary{width:100%;margin-top:12px;border:0;background:var(--brand);color:#084b74;font-weight:700;font-size:14px;border-radius:13px;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 16px rgba(133,208,255,.55)}
.btn-primary:hover{background:#34b2f6}
.btn-primary .ic{width:18px;height:18px;stroke-width:2.4}

/* task list */
.task{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px}
.task:hover{background:var(--surface-2)}
.task+.task{border-top:1px solid var(--line-2)}
.task .tico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.task .tico .ic{width:19px;height:19px}
.task .tt{flex:1;min-width:0}
.task .tt b{font-size:13.5px;display:block}
.task .tt span{font-size:12px;color:var(--ink-2)}
.count{font-size:12px;font-weight:700;min-width:24px;height:24px;border-radius:8px;display:grid;place-items:center;padding:0 6px;flex:none}
.c-red{background:var(--crit-soft);color:var(--crit)}
.c-amber{background:var(--warn-soft);color:var(--warn)}
.c-blue{background:var(--info-soft);color:var(--info)}
.c-purple{background:var(--purple-soft);color:var(--purple)}
.c-grey{background:var(--neutral-soft);color:var(--ink-2)}
.task .chev{color:var(--ink-3)}
.task .chev .ic{width:16px;height:16px}

/* messages */
.msg{display:flex;gap:11px;padding:10px 8px;border-radius:12px}
.msg:hover{background:var(--surface-2)}
.msg+.msg{border-top:1px solid var(--line-2)}
.msg .av{width:36px;height:36px;border-radius:50%;flex:none;font-size:12px}
.msg .mt{min-width:0;flex:1}
.msg .mt .r{display:flex;align-items:baseline;gap:8px}
.msg .mt b{font-size:13px}
.msg .mt time{margin-left:auto;font-size:11px;color:var(--ink-3);flex:none}
.msg .mt p{margin:1px 0 0;font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{width:8px;height:8px;border-radius:50%;background:var(--brand);flex:none;align-self:center}

/* quick actions */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;font-weight:600;color:var(--ink);text-align:left}
.qa button:hover{border-color:var(--brand);background:var(--brand-soft)}
.qa .qi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.qa .qi .ic{width:17px;height:17px}

/* activity */
.act{display:flex;gap:12px;padding:10px 8px}
.act+.act{border-top:1px solid var(--line-2)}
.act .ai{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.act .ai .ic{width:17px;height:17px}
.act .at{flex:1;min-width:0}
.act .at b{font-size:13px;display:block}
.act .at span{font-size:12px;color:var(--ink-2)}
.act time{font-size:11.5px;color:var(--ink-3);white-space:nowrap;flex:none}

/* charts row */
.charts{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.select{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
.select .ic{width:14px;height:14px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 2px 0}
.bars .colb{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.bars .bar{width:100%;max-width:26px;border-radius:7px 7px 3px 3px;background:var(--brand-soft);position:relative}
.bars .bar.full{background:linear-gradient(180deg,var(--brand),var(--brand-ink))}
.bars .bar.now::after{content:"Ahora";position:absolute;top:-23px;left:50%;transform:translateX(-50%);background:var(--brand-ink);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;white-space:nowrap}
.bars .xl{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .mid b{font-size:26px;font-weight:800;line-height:1}
.donut .mid span{font-size:11px;color:var(--ink-2)}
.legend{flex:1;min-width:150px;display:flex;flex-direction:column;gap:9px}
.legend .lg{display:flex;align-items:center;gap:9px;font-size:13px}
.legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legend .lg b{margin-left:auto;font-variant-numeric:tabular-nums}
.legend .lg .pc{color:var(--ink-2);font-size:12px;width:42px;text-align:right;font-variant-numeric:tabular-nums}

/* ready card */
.ready{background:linear-gradient(160deg,var(--brand-soft),var(--surface));border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;gap:8px}
.ready .ico{width:54px;height:54px;border-radius:15px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--brand)}
.ready .ico .ic{width:26px;height:26px}
.ready b{font-size:16px}
.ready p{margin:0;font-size:13px;color:var(--ink-2);max-width:230px}

.hamb{display:none}
.scrim{display:none}

@media (max-width:1180px){
  .grid{grid-template-columns:1fr 1fr}
  .charts{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:60;width:248px;transform:translateX(-100%);transition:transform .22s}
  .app.open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.4)}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
  .app.open .scrim{display:block}
  .hamb{display:grid}
  .grid{grid-template-columns:1fr}
  .search kbd{display:none}
}
@media (max-width:620px){
  .stats{grid-template-columns:1fr 1fr}
  .top{padding:10px 14px;gap:10px}
  .wrap{padding:16px 14px 28px}
  .head .when{margin-left:0;text-align:left}
  .me b,.me span{display:none}
}
@media (max-width:420px){.stats{grid-template-columns:1fr}}
</style>

<script>
/* Sin sesión iniciada no se puede ver el panel: vuelve al login */
(function(){
  var t=null;
  try{ t=localStorage.getItem('clinnova_token')||sessionStorage.getItem('clinnova_token'); }catch(_){}
  if(!t) location.replace('login.html');
})();
</script>
